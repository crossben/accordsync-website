# CI for the website repository (website.md section 9). The site builds from
# this repository alone — the Accord sources it reads live in the committed
# snapshot accord/. A separate drift job re-syncs the snapshot from the real
# repository (read-only token the owner creates) and fails when it has fallen
# behind; it also runs daily, so drift is caught without a website change.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # No sibling checkout needed: prebuild uses the committed accord/ snapshot
      # (sync-app skips itself when no source checkout is present).
      - run: npm ci
      - run: node scripts/check-facts.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:snippets
      - run: npm run build
      - run: npm run check:links

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/

  # Fails when accord/ is behind crossben/accordsync: re-run `npm run sync:app`
  # and commit the refreshed snapshot together with any copy/fact updates.
  drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      # Can this job read crossben/accordsync? Yes if the repository is public (the built-in
      # token is enough), or if the owner added ACCORD_APP_READ_TOKEN: a fine-grained PAT with
      # Contents: read on crossben/accordsync only. Otherwise skip with a warning instead of
      # failing CI: the build job above does not need the repository.
      - name: Check access to the Accord repository
        id: access
        env:
          READ_TOKEN: ${{ secrets.ACCORD_APP_READ_TOKEN }}
        run: |
          if [ -n "$READ_TOKEN" ] || git ls-remote https://github.com/crossben/accordsync HEAD >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift check skipped: crossben/accordsync is private and ACCORD_APP_READ_TOKEN is not set. Make the repository public, or add the secret."
          fi

      # Checked out as accord-src — never `app`, which is the website's own Next.js routes directory.
      - uses: actions/checkout@v4
        if: steps.access.outputs.ok == 'true'
        with:
          repository: crossben/accordsync
          path: accord-src
          token: ${{ secrets.ACCORD_APP_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: steps.access.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: node scripts/sync-app.mjs --require
        if: steps.access.outputs.ok == 'true'
        env:
          ACCORD_APP_DIR: accord-src
      - name: Fail if the snapshot fell behind the repository
        if: steps.access.outputs.ok == 'true'
        run: |
          if ! git diff --exit-code -- accord/; then
            echo "::error::accord/ is stale: the Accord repository moved on. Run 'npm run sync:app', then update facts/copy if check-facts asks, and commit."
            exit 1
          fi
